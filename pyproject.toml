[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heocr"
version = "0.2.0rc1"
description = "The best open pipeline for getting Hebrew text out of any document"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "HeOCR maintainers" },
]
keywords = ["hebrew", "ocr", "pdf", "docx", "text extraction", "document"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Hebrew",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Linguistic",
]
# The core stays permissive (decision 0020): no copyleft dependency in the default install.
dependencies = [
  "defusedxml>=0.7",
  "pypdfium2>=4.30",
  "Pillow>=10",
]

[project.optional-dependencies]
# Tests only: the record is checked against its JSON Schema (tests/__init__.py). Not needed at run time.
test = ["jsonschema>=4.18"]

[project.scripts]
heocr = "heocr.cli:main"

[project.urls]
Source = "https://github.com/HeOCR/heocr"
Issues = "https://github.com/HeOCR/heocr/issues"
Documentation = "https://github.com/HeOCR/heocr#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heocr*"]

[tool.setuptools.package-data]
heocr = ["schemas/*.json", "models_data/*.traineddata", "models_data/NOTICE.*", "models_data/README.md"]
